# ينشر مجلد dist داخل web-presentation على GitHub Pages
# بعد الدمج: الإعدادات → Pages → Source: GitHub Actions

name: Deploy web-presentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web-presentation/**"
      - ".github/workflows/deploy-web-presentation.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-web-presentation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-presentation/package-lock.json

      - name: Install and build
        working-directory: web-presentation
        env:
          VITE_BASE: "/AI-ML/web-presentation/"
        run: |
          npm ci
          npm run build

      - name: Lay out site (…/AI-ML/web-presentation/)
        run: |
          mkdir -p _site/web-presentation
          cp -r web-presentation/dist/. _site/web-presentation/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
